name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          # uv.lock is deliberately not committed: this is a library, and CI
          # resolving fresh is what catches an upstream release breaking us
          # (the reason ruff is capped to a minor range in pyproject).  The
          # default cache key globs uv.lock, so it matched nothing and the
          # cache never invalidated.  Key on the dependency declaration itself.
          cache-dependency-glob: "pyproject.toml"
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
