[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substantiate"
version = "0.1.0.dev0"
description = "Fail-closed grounding for RAG: every sentence verified against its cited source, or suppressed. Verifier error rates measured and published."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Steph Swierenga" }]
keywords = [
    "rag",
    "grounding",
    "hallucination-detection",
    "citation-verification",
    "llm-evaluation",
    "fail-closed",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core package is stdlib-only by design; everything else is an extra.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
fetchers = ["httpx>=0.27"]
pgvector = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/stephswierenga/substantiate"

[tool.hatch.build.targets.wheel]
packages = ["src/substantiate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"
# Archived, rejected designs. Preserved verbatim as evidence for the write-ups —
# not linted, not packaged, not collected by the default test run.
exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The system prompts are the exact strings under measurement — they are
# never rewrapped to satisfy line length.
"src/substantiate/gate.py" = ["E501"]
