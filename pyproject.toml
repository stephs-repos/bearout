[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bearout"
version = "0.0.4"
description = "Fail-closed grounding for RAG: every sentence verified against its cited source, or suppressed. Verifier error rates measured and published."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Steph Swierenga" }]
keywords = [
    "rag",
    "grounding",
    "hallucination-detection",
    "citation-verification",
    "llm-evaluation",
    "fail-closed",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The core package is stdlib-only by design; everything else is an extra.
dependencies = []

[project.optional-dependencies]
# Tested at 0.40.0 and 2.8.0 (CI runs both ends). The measured judge runs at
# temperature 0, which SDK >= 1.0 can only send via extra_body and SDK 2.x only
# under API version 2023-06-01; the adapter does both (see adapters/anthropic.py).
# Capped below 3: a new major may change the default API version again.
anthropic = ["anthropic>=0.40,<3"]
fetchers = ["httpx>=0.27"]
pgvector = ["psycopg[binary]>=3.1"]
# ruff is capped to a minor range: it formats Python embedded in Markdown, so an
# unpinned upgrade can fail CI on an unchanged repo. Bump deliberately.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16,<0.17", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/stephs-repos/bearout"
Repository = "https://github.com/stephs-repos/bearout"
Issues = "https://github.com/stephs-repos/bearout/issues"
Changelog = "https://github.com/stephs-repos/bearout/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bearout"]

# The sdist carries only what the package needs. Experiments, docs, examples,
# and the Crown-copyright e-Laws test fixtures stay in the repository.
[tool.hatch.build.targets.sdist]
only-include = ["src", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"
# Archived, rejected designs. Preserved verbatim as evidence for the write-ups —
# not linted, not packaged, not collected by the default test run.
exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The system prompts are the exact strings under measurement — they are
# never rewrapped to satisfy line length.
"src/bearout/gate.py" = ["E501"]
